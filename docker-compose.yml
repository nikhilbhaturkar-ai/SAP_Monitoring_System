services:
  postgres:
    image: postgres:16-alpine
    container_name: sap_monitoring_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sapmon
      POSTGRES_PASSWORD: sapmon
      POSTGRES_DB: sap_monitoring
    ports:
      - "5433:5432"
    volumes:
      - sap_monitoring_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapmon -d sap_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sap_monitoring_pgdata:
